name: secure_cipher
description: "Authenticated encryption (AES-256-CBC + HMAC-SHA256) and keyed hashing. Failures are reported via the shared Failure model instead of sentinel strings."
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  aes_crypt_null_safe: ^3.1.1
  crypto: ^3.0.7
  failures:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: core/failures
      ref: failures-v2.0.2

dev_dependencies:
  linter:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      ref: linter-v1.0.2
  test: any
