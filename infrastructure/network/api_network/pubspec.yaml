name: api_network
description: "API contract layer — exposes response models so feature/data layers do not depend on implementation packages like dio_network."
version: 1.2.2
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  dependencies:
    git:
      url: git@gitlab.bankcapital.co.id:mobile-services/mobile-platform.git
      path: shared/dependencies
      ref: dependencies-v1.3.0
  models:
    git:
      url: git@gitlab.bankcapital.co.id:mobile-services/mobile-platform.git
      path: core/models
      ref: models-v1.1.1

dev_dependencies:
  build_runner: any
  json_serializable: any
  linter:
    git:
      url: git@gitlab.bankcapital.co.id:mobile-services/mobile-platform.git
      ref: linter-v1.0.2
  test: any