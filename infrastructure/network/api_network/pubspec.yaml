name: api_network
description: "API contract layer — exposes response models so feature/data layers do not depend on implementation packages like dio_network."
version: 1.2.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  dependencies:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: shared/dependencies
      ref: dependencies-v1.2.0
  flutter:
    sdk: flutter
  models:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      path: core/models
      ref: models-v1.1.0

dev_dependencies:
  build_runner: any
  flutter_test:
    sdk: flutter
  json_serializable: any
  linter:
    git:
      url: https://github.com/arkariz/advance-mobile-platform
      ref: linter-v1.0.1