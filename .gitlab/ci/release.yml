# STAGE: release
# Fires on tags only. Sends webhook notification if WEBHOOK_URL is set.
# allow_failure: true — notification failure must never block a release.

notify_release:
  stage: release
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_TAG'
  needs: []
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not set — skipping."; exit 0
      fi
      curl --fail --silent --show-error \
        --max-time 10 --retry 3 --retry-delay 2 \
        -X POST "$WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d "{
              \"project\": \"${CI_PROJECT_NAME}\",
              \"tag\": \"${CI_COMMIT_TAG}\",
              \"commit\": \"${CI_COMMIT_SHA}\",
              \"commit_title\": \"${CI_COMMIT_TITLE}\",
              \"author\": \"${GITLAB_USER_NAME}\",
              \"triggered_by\": \"${GITLAB_USER_LOGIN}\",
              \"pipeline_url\": \"${CI_PIPELINE_URL}\"
            }"
  allow_failure: true
