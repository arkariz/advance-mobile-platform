# STAGE: version
# Runs only on main after all quality gates pass.
# melos version --yes → bumps versions, writes CHANGELOGs, commits, tags.
# Requires CI_VERSIONING_BOT_TOKEN (Protected + Masked variable).

versioning:
  extends: .dart_base
  stage: version
  interruptible: false  # Never interrupt mid-versioning commit
  resource_group: versioning  # Serialize; prevents simultaneous runs on main
  needs:
    - job: unit_test
      optional: true
    - job: analyze
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_TAG == null'
  cache:
    - key:
        prefix: pub-$FLUTTER_VERSION
        files:
          - pubspec.yaml
          - pubspec.lock
      paths: [.pub-cache/, .dart_tool/]
      policy: pull
  before_script:
    - !reference [.flutter_symlink, before_script]
    - export PATH="$PUB_CACHE/bin:$PATH"
    - dart pub global activate melos
    - git config user.email "ci-bot@gitlab.local"
    - git config user.name "CI Bot"
    - |
      git remote set-url origin \
        "https://oauth2:${CI_VERSIONING_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout -B "$CI_COMMIT_BRANCH"
    - git branch --set-upstream-to="origin/$CI_COMMIT_BRANCH" "$CI_COMMIT_BRANCH"
    - melos bootstrap
  script:
    - melos version --yes
    - git push origin HEAD:main --follow-tags
  artifacts:
    expire_in: 1 day
    paths:
      - "**/CHANGELOG.md"
      - "**/pubspec.yaml"
